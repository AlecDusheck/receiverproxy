# 160x80 module, 1/40 scan, DP5525: mined from 18 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 18 files for this geometry and chip).
# Not bench-verified. Examples: Q2AC40(3364+5368)-W1.rcvbp, Q2AC40(3264+5368)-V3.4-W1.rcvbp, Q2AC40(3364+5158)-W1.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "160x80-40s-dp5525"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 10

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/dp5525.toml"

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
