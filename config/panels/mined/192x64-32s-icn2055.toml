# 192x64 module, 1/32 scan, ICN2055: mined from 3 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 3 files for this geometry and chip).
# Not bench-verified. Examples: Q1.6AG32(2055+2013)-W1 .rcvbp, Q1.6AG32(2055+5266)-W1.rcvbp, Q1.6AG32(2065+32019)-W1 .rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6144 entries; the block-7 image builder packs
# at most 4096, so gen-config writes the .rcvbp but not the boot image yet.

name = "192x64-32s-icn2055"

[module]
width = 192
height = 64
scan = 32
line_dir = 0
data_groups = 0
serial_clock = 10

[screen]
width = 192
height = 64

[chip]
library = "config/chips/mined/icn2055.toml"

[current]
gains = [208, 208, 208, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 192

[boot]
arm_at_boot = true
