# Driver-chip identity as the vendor corpus writes it for SM16169-family
# modules — the family the SM16269S on this panel belongs to.
#
# Every vendor .rcvbp in vendor/led-config-files whose name carries "16169"
# (P2.5 16S, P3.91 16S x2 incl. the E80 build, P6.67 6S, P8) agrees on this
# identity byte for byte: chip id 0x002F, secondary id 0x008A, serial clock
# 10, and the chip-control block below. None of those files carries a
# register record; the id alone selects the card's driver protocol and
# register defaults.
#
# What we had been using (config/chips/sm16269s-factory.toml, id 0x014C, no
# secondary) was inherited from the configuration the card arrived holding —
# the previous owner's 256x384 wall — which is not evidence about this panel.
# The gateware dispatches on the id (docs/fpga/chip-id.md), so a wrong one
# means the wrong data protocol at the hub even when commands still land.
#
# Registers: the corpus gives none; these are the values known to reach the
# chips on this bench (gain register 0x16 moves the supply current 18x above
# noise), kept so the drivers keep arming. Register 0x02 is patched to scan-1.

name = "SM16169 family (vendor corpus identity)"
family_id = 0x002F
sub_id = 0x008A
serial_clock = 10

# From P3.91-64x64-16S-16169+2012-HL4.0-8.63-E80.rcvbp record 0x01 +0x0C4.
# The P2.5/P6.67/P8 files differ only in bytes 10..13 (00 81 00 81 vs
# 01 01 01 01 / 02 01 02 01 — the post-GCLK values).
chip_control = [0x00, 0x0e, 0x03, 0x04, 0x08, 0x01, 0x03, 0x00, 0x00, 0x00,
                0x00, 0x81, 0x00, 0x81, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00]

order = [
  0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x0e,
  0x0f, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1a, 0x1b,
  0x1c, 0x1d, 0x1e, 0x1f, 0x20, 0x22, 0xf0,
]

[registers]
0x02 = [0x0f, 0x0f, 0x0f]
0x03 = [0x3f, 0x3f, 0x3f]
0x04 = [0x00, 0x00, 0x00]
0x05 = [0x00, 0x00, 0x00]
0x06 = [0x00, 0x00, 0x00]
0x07 = [0x04, 0x04, 0x04]
0x08 = [0x00, 0x00, 0x00]
0x09 = [0x00, 0x00, 0x00]
0x0a = [0x00, 0x00, 0x00]
0x0b = [0x2c, 0x2c, 0x2c]
0x0c = [0x00, 0x01, 0x03]
0x0d = [0x00, 0x00, 0x00]
0x0e = [0x05, 0x05, 0x05]
0x0f = [0x00, 0x00, 0x00]
0x10 = [0x00, 0x00, 0x00]
0x11 = [0x04, 0x1e, 0x50]
0x12 = [0x00, 0x00, 0x00]
0x13 = [0x00, 0x00, 0x00]
0x14 = [0x14, 0x22, 0x32]
0x15 = [0x00, 0x00, 0x00]
0x16 = [0x30, 0x30, 0x30]
0x17 = [0x00, 0x00, 0x00]
