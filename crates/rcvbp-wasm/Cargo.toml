[package]
name = "rcvbp-wasm"
description = "rcvbp and wall for the browser: generate, inspect and diff configs, check wall layouts"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published: the browser build, not part of the `receiverproxy` install.
publish = false

[lib]
# The rlib lets `daemon --features ts` read the response structs natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
panelspec.workspace = true
receivers.workspace = true
rcvbp.workspace = true
wall.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Pinned to the installed wasm-bindgen CLI; the two must match exactly
# (docs/ui.md section 6).
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "0.6"
ts-rs = { workspace = true, optional = true }

[features]
# `#[derive(TS)]` on the response structs, for web/src/api/types.ts.
ts = ["dep:ts-rs", "wall/ts", "rcvbp/ts"]

[lints]
workspace = true
