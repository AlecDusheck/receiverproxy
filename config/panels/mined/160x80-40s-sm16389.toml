# 160x80 module, 1/40 scan, SM16389: mined from 4 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 4 files for this geometry and chip).
# Not bench-verified. Examples: Q2AC40(16389+5368)-V3.6-W1.rcvbp, Q2AC40(16389+5158)-V3.7-W1.rcvbp, Q2AC40(16389+32020)-V3.6-W1.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so gen-config writes the .rcvbp but not the boot image yet.

name = "160x80-40s-sm16389"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 15

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/sm16389.toml"

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
