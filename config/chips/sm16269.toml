# Driver-chip library: SM16269 / SM16269S.
#
# Source: LEDVISION 9.6 ChipSetting.dll, dialog IDD20174 (CChipSettingSM16269Ex),
# "Default Parameter" builders at file offsets 0x27F8E0 / 0x27F7E0 (identical
# tables). Record 0x84 is 33 (register, R, G, B) quads in the order below, then
# zeros. Field bit layouts: docs/chips.md.

name = "SM16269"
family_id = 0x014C
sub_id = 0x014D

# Register order in the record; 0xF0 is a real register (black-screen standby
# bits), not just a terminator.
order = [
  0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x0e,
  0x0f, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1a, 0x1b,
  0x1c, 0x1d, 0x1e, 0x1f, 0x20, 0x22, 0xf0,
]

# Vendor "Default Parameter" values, R G B per register.
[registers]
0x02 = [0x3f, 0x3f, 0x3f]   # preserved across a defaults reload by the vendor; gain-class (NOT RESOLVED)
0x03 = [0x3f, 0x3f, 0x3f]   # [7:6] low-gray high-refresh level
0x04 = [0x00, 0x00, 0x00]   # [7] energy saving
0x05 = [0x00, 0x00, 0x00]
0x06 = [0x00, 0x00, 0x00]
0x07 = [0x44, 0x44, 0x44]   # [7:5] freq division factor-1 (=3), [4:3] line gray (0=64), [2] blanking coarse, [1:0] fine
0x08 = [0x00, 0x00, 0x00]
0x09 = [0x00, 0x00, 0x00]
0x0a = [0x02, 0x02, 0x02]   # [7] standby mode, inverted (0 = on)
0x0b = [0x0c, 0x0c, 0x0c]   # [3:2] low-gray uniformity, [1:0] cross-plate hi bits
0x0c = [0x08, 0x18, 0x30]   # cross-plate optimization low byte
0x0d = [0x00, 0x00, 0x00]
0x0e = [0x05, 0x05, 0x05]
0x0f = [0x00, 0x00, 0x00]   # [7:6] low-gray improvement
0x10 = [0x00, 0x00, 0x00]
0x11 = [0x00, 0x00, 0x00]
0x12 = [0x00, 0x00, 0x00]
0x13 = [0x00, 0x00, 0x00]   # [4] photo optimization, [3] low-gray high-refresh enable
0x14 = [0x14, 0x22, 0x32]   # [7:4] low-gray comp 1, [3] open-circuit detect, [2:0] cross level
0x15 = [0x00, 0x00, 0x00]   # [6:4] low-gray comp 2
0x16 = [0x30, 0x30, 0x30]   # [5:0] current gain 0-63 (the dialog's sliders)
0x17 = [0x00, 0x00, 0x00]
0x18 = [0x01, 0x01, 0x01]   # [1:0] blanking ghost level
0x19 = [0x04, 0x03, 0x03]   # [2:0] blanking level
0x1a = [0x03, 0x01, 0x01]   # [2:0] first-line dark compensation
0x1b = [0x14, 0x14, 0x14]
0x1c = [0x12, 0x8f, 0x8f]
0x1d = [0x00, 0x00, 0x00]
0x1e = [0x00, 0x00, 0x00]
0x1f = [0x0c, 0x0c, 0x0c]
0x20 = [0x00, 0x00, 0x00]   # [7:6] small period num
0x22 = [0x00, 0x00, 0x00]
0xf0 = [0x03, 0x03, 0x03]   # [7:4] black-screen standby (0xA = on)
