name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # crates.io Trusted Publishing: the token is minted for this job and
      # revoked when it ends, so no CARGO_REGISTRY_TOKEN secret is stored.
      id-token: write
      # Only the release step needs this.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The annotated tag object, for its message below.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order; each publish waits for the index before the next.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eu
          for p in receiverproxy-panelspec receiverproxy-rawlink \
                   receiverproxy-colorlight receiverproxy-receivers \
                   receiverproxy-rcvbp receiverproxy-wall \
                   receiverproxy-sources receiverproxy-driver \
                   receiverproxy-ops receiverproxy-daemon receiverproxy; do
            cargo publish -p "$p"
            sleep 30
          done

      - name: Tag message
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > tag-message.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: tag-message.txt
          generate_release_notes: false
