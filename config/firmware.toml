# The vendor firmware images, one entry each; the bytes live at base_url
# (third-party/README.md says where they come from and how they are named).
# `rxp firmware list` prints this table; `provision --firmware NAME` and
# `firmware install NAME` take a name from it and verify the sha256 before
# any write. `version` is what the card reports after the install; `size`
# and `sha256` are the file on disk.
#
# `base_url` is the asset host; `rxp firmware fetch NAME` downloads
# base_url/path into the config directory's firmware cache. Paths are
# firmware/<vendor>/<family>/<file>. Empty means local only: the
# image is expected under third-party/firmware (local archive) or in the cache.
base_url = "https://assets.receiverproxy.com"

