# 160x80 module, 1/40 scan, LS9929: mined from 8 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (73% of the 11 files for this geometry and chip).
# Not bench-verified. Examples: P2 40S -320x320folio.rcvbp, P2-160X640.rcvbp, P2-V3+9929+9736+2880HZ.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
