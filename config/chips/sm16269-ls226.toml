# Driver-chip library: SM16269, as revised in LEDSetting 2.2.6 (June 2025).
#
# Reached in the vendor tooling as chip type 0x14C with a secondary chip id in
# {0x14D, 0x16F, 0x170, 0x187, 0x215, 0x216, 0x217, 0x218}: the predicate at
# CLTInterface.dll 0x1802A8FC0. Register builder 0x1802C7580.
#
# Chip id 0x214 ("SM16269S" in the name table) is deliberately NOT used here:
# it is a dead id in the vendor's own code: every chip jump table sends it to
# the default arm, so it gets no registers, no chip control, no serial clock
# and no PWM classification. The card goes dark on it, consistently.
#
# Serial clock follows the vendor's own rule (ResetIS): the sub-id overrides
# max scan, and the clock follows from that: sub 0x14D -> max scan 64 -> 7;
# sub 0x217/0x218 -> max scan 32 -> 8; no sub-id -> max scan 16 -> 15.

name = "SM16269 (LEDSetting 2.2.6)"
family_id = 0x014C
sub_id = 0x014D
serial_clock = 7

# ResetChipControl seed for 0x14C, with indices 11 and 13 carrying the
# post-GCLK values that SetGclkNumsOfChipControlByChipCustom computes.
chip_control = [0x00, 0x0e, 0x01, 0x05, 0x06, 0x01, 0x03, 0x00, 0x00, 0x00,
                0x00, 0x97, 0x00, 0x97, 0x00, 0x08, 0x02, 0x00, 0x0a, 0x02]

order = [
  0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x0e,
  0x0f, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1a, 0x1b,
  0x1c, 0x1d, 0x1e, 0x1f, 0x20, 0x22, 0xf0,
]

[registers]
0x02 = [0x3f, 0x3f, 0x3f]   # replaced by scan-1 on load
0x03 = [0x3f, 0x3f, 0x3f]
0x04 = [0x00, 0x00, 0x00]
0x07 = [0x48, 0x49, 0x4b]   # per-colour in this revision (was 0x44 flat)
0x05 = [0x00, 0x00, 0x00]
0x06 = [0x00, 0x00, 0x00]
0x08 = [0x00, 0x00, 0x00]
0x09 = [0x00, 0x00, 0x00]
0x0a = [0x02, 0x02, 0x02]
0x0b = [0x0c, 0x0c, 0x0c]
0x0c = [0x08, 0x18, 0x30]
0x0d = [0x00, 0x00, 0x00]
0x0e = [0x05, 0x05, 0x05]
0x0f = [0xc0, 0xc0, 0xc0]   # was 0x00
0x10 = [0x00, 0x00, 0x00]
0x11 = [0x00, 0x00, 0x00]   # was 04 1e 50
0x12 = [0x00, 0x00, 0x00]
0x13 = [0x00, 0x00, 0x00]
0x14 = [0x14, 0x22, 0x32]
0x15 = [0x00, 0x00, 0x00]
