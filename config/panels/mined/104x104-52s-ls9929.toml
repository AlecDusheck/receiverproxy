# 104x104 module, 1/52 scan, LS9929: mined from 9 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (90% of the 10 files for this geometry and chip).
# Not bench-verified. Examples: p3.07-104x52-52S-9929+9739-5.0(104x416)-75B.rcvbp, p3.07-104x52-52S-9929+9739-5.0(208x208folio)-75B.rcvbp, p3.07-104x52-52S-9929+9739-5.0-75B.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 5408 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "104x104-52s-ls9929"

[module]
width = 104
height = 104
scan = 52
line_dir = 0
data_groups = 0
serial_clock = 10

[screen]
width = 104
height = 104

[chip]
library = "config/chips/mined/ls9929.toml"

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 104

[boot]
arm_at_boot = true
