# SM16269S (chip id 0x014C, no sub-id): the register table that drives the
# P2.5 128x64 SM16269S module on a Colorlight E120 running firmware 16.53.
#
# Every register value below is read straight out of record 0x0a84 of
# third-party/configs/P2.5-32S-128X64-SM16269S-256X384I.rcvbp, whose records
# match the card's day-one flash (tests/factory.rs), decoded with
# scripts/chipregs.py. It is the value set this module was driven with, which
# the derived libraries next to it are not: config/chips/sm16269-defaults.toml
# holds the vendor tool's generic "Default Parameter" set and
# sm16269-defaults-revised.toml the later revision of it, and both disagree
# with this table in eleven registers. Several of those govern greyscale and
# blanking, which is why a panel configured from them lights near-uniformly
# regardless of pixel data.
#
# Identity fields (family, sub-id, chip_control) are shared with
# config/chips/sm16269-defaults.toml: our generated record 0x01 already
# reproduces the factory's chip_control at +0x0C4..0x0D7 byte-for-byte, so
# only the register table was ever wrong.
#
# Register 0x02 reads 0x0f here = scan-1, confirming the module is 1/16 scan
# despite the "32S" in the factory file's name. It is overwritten from the
# panel spec's scan on load, as in every other library.

vendor = "Sunmoon"
datasheet = "https://assets.receiverproxy.com/datasheets/chips/sm16269.pdf"
name = "SM16269S"
status = "verified"
family_id = 0x014C
# The factory file writes no secondary chip id at all (record 0x01 +0x0E9 and
# +0x205 are both zero). Per the vendor's ResetIS rule the sub-id overrides
# max scan, and 0x14D would claim max scan 64 on a 1/16 module.
sub_id = 0x0000
serial_clock = 15

chip_control = [0x00, 0x0e, 0x01, 0x05, 0x06, 0x01, 0x03, 0x00, 0x00, 0x00,
                0x00, 0x97, 0x00, 0x97, 0x00, 0x08, 0x02, 0x00, 0x0a, 0x02]

order = [
  0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x0e,
  0x0f, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1a, 0x1b,
  0x1c, 0x1d, 0x1e, 0x1f, 0x20, 0x22, 0xf0,
]

# R G B per register. Lines marked "differs" are where this table departs from
# config/chips/sm16269-defaults.toml; the comment gives the value that library
# carries.
[registers]
0x02 = [0x0f, 0x0f, 0x0f]   # replaced by scan-1 on load (0x0f = 1/16 scan)
0x03 = [0x3f, 0x3f, 0x3f]
0x04 = [0x00, 0x00, 0x00]
0x05 = [0x00, 0x00, 0x00]
0x06 = [0x00, 0x00, 0x00]
0x07 = [0x04, 0x04, 0x04]   # differs from the 0x44 default: freq division factor-1 is 0
0x08 = [0x00, 0x00, 0x00]
0x09 = [0x00, 0x00, 0x00]
0x0a = [0x00, 0x00, 0x00]   # differs, was 0x02
0x0b = [0x2c, 0x2c, 0x2c]   # differs, was 0x0c: low-gray uniformity bits set
0x0c = [0x00, 0x01, 0x03]   # differs, was 08/18/30: cross-plate optimization
0x0d = [0x00, 0x00, 0x00]
0x0e = [0x05, 0x05, 0x05]
0x0f = [0x00, 0x00, 0x00]
0x10 = [0x00, 0x00, 0x00]
0x11 = [0x04, 0x1e, 0x50]   # differs, was all zero
0x12 = [0x00, 0x00, 0x00]
0x13 = [0x00, 0x00, 0x00]
0x14 = [0x14, 0x22, 0x32]
0x15 = [0x00, 0x00, 0x00]
0x16 = [0x30, 0x30, 0x30]   # current gain
0x17 = [0x00, 0x00, 0x00]
0x18 = [0x01, 0x01, 0x01]
0x19 = [0x02, 0x02, 0x02]   # differs, was 04/03/03: blanking level
0x1a = [0x00, 0x00, 0x00]   # differs, was 03/01/01: first-line dark comp
0x1b = [0x00, 0x00, 0x00]   # differs, was 0x14
0x1c = [0x00, 0x00, 0x00]   # differs, was 12/8f/8f
0x1d = [0x00, 0x00, 0x00]
0x1e = [0x00, 0x00, 0x00]
0x1f = [0x00, 0x00, 0x00]   # differs, was 0x0c
0x20 = [0x00, 0x00, 0x00]
0x22 = [0x00, 0x00, 0x00]
0xf0 = [0x00, 0x00, 0x00]   # differs, was 0x03: black-screen standby bits clear
