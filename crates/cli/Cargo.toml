[package]
name = "cli"
description = "receiverproxy: the rxp command-line tool that configures and drives LED receiving cards"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run -p cli` and the rcvbp-wasm test that shells out to it.
default-run = "rxp"

[[bin]]
name = "rxp"
path = "src/main.rs"

# The same program under the project's name; src/receiverproxy.rs includes main.rs.
[[bin]]
name = "receiverproxy"
path = "src/receiverproxy.rs"

[dependencies]
ops.workspace = true
daemon.workspace = true
wall.workspace = true

anyhow.workspace = true
libc.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true
