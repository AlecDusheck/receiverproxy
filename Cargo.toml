[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
e120-proto = { path = "crates/e120-proto" }
e120-rcvbp = { path = "crates/e120-rcvbp" }
e120-net = { path = "crates/e120-net" }

anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
