# Driver-chip library: SM16169S = chip id 0x00DE, exactly as the vendor's
# ResetChipCustom / ResetChipControl / ResetIS produce it.
#
# *** THIS CHIP HAS NO ADDRESSED REGISTER TABLE. ***
#
# 0x00DE is a non-SH part: it carries no record 0x84 at all. Everything the
# card is told about the driver lives in the 16-byte SChipCustom block at
# record 0x01 +0x06A..+0x079 (basic-pack body +0x70..+0x7F). Confirmed two
# ways: (a) ResetChipCustom's case for 0x00DE (libCLTDevice.1.dylib
# 0x15A402..0x15A468) writes only SChipCustom and jumps to the SetChipCustom
# tail at 0x15DF74, never touching SChipCustomPlus (record 0x84); (b) all 59
# vendor .rcvbp files in the corpus that declare chip 0x00DE have no 0x0A84
# record whatsoever.
#
# crates/e120-rcvbp/src/chips.rs loads it through chip_custom,
# chip_custom_scan_patch, chip_custom_ex, emit_record_84 and gray_bits
# (docs/chip-libraries-non-sh.md). Not measured on the bench.
#
# Sources (all file offsets in the macOS build libCLTDevice.1.dylib unless
# marked LEDSet; LEDSet = CLTInterface.dll from LEDSetting 2.2.6, image base
# 0x180000000). Cross-checked against 59 vendor configs. The vendor name for
# 0x00DE is "SM16169S" (CLTInterface.dll name-table record at file offset
# 0xD70558, group 1).

name = "SM16169S (vendor defaults, chip 0x00DE)"
family_id = 0x00DE

# The vendor writes either 0x0000 or 0x00DE at record +0x0E9/+0x205 for this
# chip (44 / 15 of the 59 corpus files). Nothing in the library branches on
# GetChipTypeEx() == 0xDE, so it is cosmetic; 0 is the ResetIS state.
sub_id = 0x0000

# ResetIS @ 0x1307F0: `if (IsPWMChip()) { maxScan = GetChipMaxScanMode();
#   if (maxScan >= 0x21) serialClock = 7 else serialClock = 15 }`
#   (0x130AD6 IsPWMChip, 0x130AFE GetChipMaxScanMode, 0x130B13 `cmpl $0x21`,
#    0x130B74 `movw $0xf, 0x7a(%rbx)`).
# IsPWMChip(0xDE) = true (explicit id test, `cmpl $0xde, %eax` @ 0xF8C95).
# GetChipMaxScanMode(0xDE) = 16 (dword table @ 0x3FF93C, index chipType-0x10,
#   loaded at 0xFE760). 16 < 0x21, so:
serial_clock = 15

# SChipControl, record 0x01 +0x0C4..+0x0D7 / basic-pack body +0x91..+0xA4.
#
# ResetChipControl @ 0x1454D0, jump table @ 0x146030 (index chipType-0x10,
# ids 0x10..0x15D). Chip 0x00DE -> case 0x145CDA, which is NOT shared with any
# other id. It writes:
#   0x145CDA movabsq $0x0003010804020E00 -> bytes 0..7  = 00 0e 02 04 08 01 03 00
#   0x145CEB movw    $0x0000, 0xd5ed     -> bytes 8..9  = 00 00
#   0x145CFD movl    $0x01010101, 0xd5ef -> bytes 10..13 = 01 01 01 01
#   0x145CF4 movw    $0x1000, 0xd5f3     -> bytes 14..15 = 00 10
#   0x1454EB movb    $0x0, 0xd5f6 (prologue, every chip) -> byte 17 = 00
# Bytes 16, 18 and 19 are NOT written for this chip. The constructor bzeroes
# OBJ+0xD4E1 for 0x124 bytes (0x12E80E-0x12E81A), which covers the whole
# SChipControl at OBJ+0xD5E5, so on a freshly built parameter object they are
# zero. (In the corpus they carry leftovers from whichever chip was selected
# before — 00 00, 0a 02, 05 05 and 0c 00 all occur.)
#
# Bytes 10..13 are then recomputed by SetGclkNumsOfChipControlByChipCustom
# @ 0x151580 (jump table @ 0x1530FC, index chipType-0x12; 0x00DE -> case
# 0x151F21) and stored back by the loader (CRcvParamFileManager::
# LoadBpBufFromBuffer call site 0x1C81EF, SetChipControl at 0x1C81FD):
#   n = (chipCustom[2] >> 5) & 3        (0x151F21 shrb $0x5 / andb $0x3)
#   n == 3 -> movl $0x81008100, 0xa(%rsi)  (0x152687) -> 00 81 00 81
#   n == 2 -> movl $0x01010101, 0xa(%rsi)  (0x15267B) -> 01 01 01 01
#   n <  2 -> untouched (falls through to 0x152502)
# The reset default chipCustom[2] is 0xEF (see chip_custom below), so n = 3
# and the block ends 00 81 00 81. This holds for every scan, because the scan
# patch only touches bits 3:0 of chipCustom[2].
#
# LEDSetting 2.2.6 agrees byte for byte: CLTInterface.dll ResetChipControl
# @ 0x18028A600 (two-level table, byte index @ 0x18028B8D8, dword targets
# @ 0x18028B784, index chipType-0x10) sends 0x00DE to 0x18028A7C1, which
# writes the same 20 bytes into the struct at object offset +0x25FD.
chip_control = [0x00, 0x0e, 0x02, 0x04, 0x08, 0x01, 0x03, 0x00, 0x00, 0x00,
                0x00, 0x81, 0x00, 0x81, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00]

# SChipCustom, record 0x01 +0x06A..+0x079 / basic-pack body +0x70..+0x7F.
# THIS is the chip's configuration — the equivalent of record 0x84 on an SH
# part. Values below are for scan 16; see chip_custom_scan_patch.
#
# ResetChipCustom @ 0x156EA0. Common prologue, for every chip:
#   0x156F02 IsPWMChip() -> true for 0xDE, so (0x156F6E..0x156F97)
#            chipCustom[0] |= 0x80;  v = GetSerialClockFrequency() (vt+0x590
#            = 0x1619D0);  chipCustom[1] = v & 0xFF;
#            chipCustom[0] = (chipCustom[0] & 0x80) | ((v >> 8) & 0x7F)
#            -> 0x80, 0x0F for serial clock 15
#   0x156FCA/0x156FD5 zero chipCustom[2..15]
# Case 0x00DE (jump table @ 0x15E76C, index chipType; case 0x15A402, not
# shared with any other id):
#   0x15A41C movb $0x39, -0x12d  -> chipCustom[3] = 0x39
#   0x15A423 movb $0x39, -0x12b  -> chipCustom[5] = 0x39
#   0x15A42A movb $0x39, -0x129  -> chipCustom[7] = 0x39
#   0x15A431 movl $0x05C00400, -0x128 -> chipCustom[8..11]  = 00 04 c0 05
#   0x15A43B movw $0x03C0, -0x124     -> chipCustom[12..13] = c0 03
#   0x15A444 al = GetScanMode() (vt+0x580 = 0x16E670);
#   0x15A450 al = ((al - 1) & 0x0F) | 0xE0;
#   0x15A456/45C/462 chipCustom[2] = chipCustom[4] = chipCustom[6] = al
#   0x15A468 jmp 0x15DF74 -> SetChipCustom(vt+0x118). Nothing else is touched:
#            chipCustom[14..15] stay 0 from the prologue.
#
# LEDSetting 2.2.6, CLTInterface.dll ResetChipCustom @ 0x18029CE00 (byte index
# table @ 0x1802A5E8C, dword targets @ 0x1802A5A90, index = chipType), case
# 0x00DE -> 0x18029E722, emits the identical block:
#   0x18029E735 mov dword [rbp+0x29a], 0x39EF39EF -> cc[2..5]  = ef 39 ef 39
#   0x18029E73F mov dword [rbp+0x29e], 0x040039EF -> cc[6..9]  = ef 39 00 04
#   0x18029E749 mov dword [rbp+0x2a2], 0x03C005C0 -> cc[10..13]= c0 05 c0 03
#   0x18029E753 GetScanMode() (vt+0x420), then helper 0x1802C7940 which does
#     cc[2] = (cc[2] & ~0x0F) | ((scan-1) & 0x0F), and the same for cc[4], cc[6].
#
# Layout (three per-colour pairs plus three 16-bit LE words — the pairing is
# inferred from the R/G/B shape of every other chip's block, MEDIUM):
#   [0]      0x80 = "use self GCK" (IsPWMChip), plus serial-clock bits 14:8
#   [1]      serial clock low byte (15)
#   [2][4][6]  per-colour word A high half: bits 3:0 = scan-1 (HIGH),
#              bits 7:4 = 0xE default; SetGclkNums reads bits 6:5 (HIGH)
#   [3][5][7]  per-colour word A low half, default 0x39
#   [8..9]   0x0400 LE   [10..11] 0x05C0 LE   [12..13] 0x03C0 LE
#   [14..15] 0x0000
chip_custom = [0x80, 0x0f, 0xef, 0x39, 0xef, 0x39, 0xef, 0x39,
               0x00, 0x04, 0xc0, 0x05, 0xc0, 0x03, 0x00, 0x00]

# The loader/reset rule the generator must apply, equivalent to
# "reg 0x02 = scan - 1" on the SH parts:
#   chip_custom[2] = chip_custom[4] = chip_custom[6]
#                  = (0xE0 | ((scan - 1) & 0x0F))
# (libCLTDevice 0x15A444-0x15A462; LEDSet 0x1802C7940.)
chip_custom_scan_patch = { bytes = [2, 4, 6], mask = 0x0F, base = 0xE0 }

# SChipCustomEX, record 0x01 +0x0E0..+0x0E3 / basic-pack body +0xD0.
# ResetChipCustom's prologue sets it to 0 for every chip
# (0x156FFF `movl $0x0, -0x174(%rbp)` then vt+0x128 = SetChipCustomEX at
# 0x157016) and the 0x00DE case never overrides it. All 59 corpus files carry
# 00 00 00 00. HIGH.
chip_custom_ex = [0x00, 0x00, 0x00, 0x00]

# No record 0x84 is emitted for this chip.
emit_record_84 = false

# Record +0x023, the grey-depth byte. GetGrayLevelCalType(0xDE) = 31 (0x14C
# uses 12), so the SH derivation in chips.rs::gray_bits (registers 0x07/0x03)
# does not apply. 56 of 59 corpus files carry 14; the other 3 carry 13.
# The exact GetGrayLevel path for cal-type 31 is NOT RESOLVED.
gray_bits = 14

# Per-id record 0x01 overrides relative to the 0x014C library. Everything not
# listed here is chip-independent.
[record01_overrides]
# +0x036 / +0x204 chip id: 0xDE / 0x00 (fits the low byte).
"0x036" = 0xDE
"0x204" = 0x00
# +0x0E9 / +0x205 sub id.
"0x0E9" = 0x00
"0x205" = 0x00
# +0x02F: the vendor Reset() default is 1 (`movl $0x1, 0xd4(%rdi)` @ 0x12FACD)
# and ALL 59 SM16169S corpus files carry 1. Our 0x14C file inherited 0 from
# the reference file.
"0x02F" = 0x01
# +0x043: ALL 59 SM16169S corpus files carry 0. Our 0x14C file inherited 0x60
# from the reference file (8 of 1146 vendor files use 0x60; none of them is this chip).
"0x043" = 0x00
