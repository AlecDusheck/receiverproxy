# 192x64 module, 1/32 scan, SM16259: mined from 4 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 4 files for this geometry and chip).
# Not bench-verified. Examples: Q1.6AG32(16259+2013)-W1.rcvbp, Q1.6AG32(16259+5166)-W1.rcvbp, Q1.6AG32(16259+5266)-W1.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6144 entries; the block-7 image builder packs
# at most 4096, so gen-config writes the .rcvbp but not the boot image yet.

name = "192x64-32s-sm16259"

[module]
width = 192
height = 64
scan = 32
line_dir = 0
data_groups = 0
serial_clock = 10

[screen]
width = 192
height = 64

[chip]
library = "config/chips/mined/sm16259.toml"

[current]
gains = [57, 57, 57, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 192

[boot]
arm_at_boot = true
