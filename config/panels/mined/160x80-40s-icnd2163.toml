# 160x80 module, 1/40 scan, ICND2163: mined from 13 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 13 files for this geometry and chip).
# Not bench-verified. Examples: P2.0-6363-3840-2021.1.27.rcvbp, P2.0-6363-3840-2020.9.12.rcvbp, Q2AC40(6363+5368)-V3.6-W1.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "160x80-40s-icnd2163"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 15

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/icnd2163.toml"

[current]
gains = [230, 230, 230, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
