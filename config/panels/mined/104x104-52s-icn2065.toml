# 104x104 module, 1/52 scan, ICN2065: mined from 7 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 7 files for this geometry and chip).
# Not bench-verified. Examples: P1.538+6565+208X104-52S+75E.rcvbp, P1.538+2065+208X104-52S+E320.rcvbp, P1.538+6565+208X104-52S+E320.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 5408 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "104x104-52s-icn2065"

[module]
width = 104
height = 104
scan = 52
line_dir = 0
data_groups = 1
serial_clock = 9

[screen]
width = 104
height = 104

[chip]
library = "config/chips/mined/icn2065.toml"

[current]
gains = [208, 208, 208, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 104

[boot]
arm_at_boot = true
