# 112x104 module, 1/52 scan, ICN2065: mined from 9 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 9 files for this geometry and chip).
# Not bench-verified. Examples: indoorP1.53-208104-52S-2065+2018-V3.X.rcvbp, USF-P1.538-208X104-52S-ICN2065-ICN2018（2宽4高）（耦合优化）.rcvbp, USF-P1.538-208X104-52S-ICN2065-ICN2018（1宽8高）.rcvbp
