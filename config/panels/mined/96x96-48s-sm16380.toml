# 96x96 module, 1/48 scan, SM16380: mined from 4 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 4 files for this geometry and chip).
# Not bench-verified. Examples: P1.667-192x96-48S-16380+5158-H.rcvbp, P1.667-192x96-48S-16380+2018,5368-H.rcvbp, CD-P1.66(48S)-96X192-SM16380+5368-JJ-8.85.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 4608 entries; the block-7 image builder packs
# at most 4096, so gen-config writes the .rcvbp but not the boot image yet.

name = "96x96-48s-sm16380"

[module]
width = 96
height = 96
scan = 48
line_dir = 0
data_groups = 1
serial_clock = 15

[screen]
width = 96
height = 96

[chip]
library = "config/chips/mined/sm16380.toml"

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 96

[boot]
arm_at_boot = true
