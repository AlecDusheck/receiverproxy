# 160x80 module, 1/40 scan, FM6127: mined from 3 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 3 files for this geometry and chip).
# Not bench-verified. Examples: P2-6047+2018&5566&5368-V6.X&S-1920hz-E80.rcvbp, P2-6047+2018,5566,5368-V6.X,S-1920hz-E80.rcvbp, P2-6047+2018,5566,5368-V6.X,S-1680hz-75B,E80.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so gen-config writes the .rcvbp but not the boot image yet.

name = "160x80-40s-fm6127"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 4

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/fm6127.toml"

[current]
gains = [63, 63, 63, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
