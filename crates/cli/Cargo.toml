[package]
name = "receiverproxy"
description = "Configure and drive Colorlight LED receiving cards over raw Ethernet: the rxp command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "hardware-support"]
exclude.workspace = true
readme = "../../README.md"
# `cargo run -p receiverproxy` and the rcvbp-wasm test that shells out to it.
default-run = "rxp"

[[bin]]
name = "rxp"
path = "src/main.rs"

# The same program under the project's name; src/receiverproxy.rs includes main.rs.
[[bin]]
name = "receiverproxy"
path = "src/receiverproxy.rs"

[dependencies]
ops.workspace = true
daemon.workspace = true
wall.workspace = true

anyhow.workspace = true
libc.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true
