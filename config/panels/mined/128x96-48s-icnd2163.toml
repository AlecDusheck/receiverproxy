# 128x96 module, 1/48 scan, ICND2163: mined from 4 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 4 files for this geometry and chip).
# Not bench-verified. Examples: P1.5625-2163+128X96-48S-75E.rcvbp, P1.5625 128X96 48s.rcvbp, P1.5625 128X96 48s.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6144 entries; the block-7 image builder packs
# at most 4096, so gen-config writes the .rcvbp but not the boot image yet.

name = "128x96-48s-icnd2163"

[module]
width = 128
height = 96
scan = 48
line_dir = 0
data_groups = 1
serial_clock = 14

[screen]
width = 128
height = 96

[chip]
library = "config/chips/mined/icnd2163.toml"

[current]
gains = [230, 230, 230, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 128

[boot]
arm_at_boot = true
