# 160x80 module, 1/40 scan, ICN2065: mined from 19 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 19 files for this geometry and chip).
# Not bench-verified. Examples: P2+6565+160X80-40S+75E.rcvbp, Q2AC40(2065+5366)-W1.rcvbp, Q2AC40(2065+32020)-V3.6-W1.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "160x80-40s-icn2065"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 9

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/icn2065.toml"

[current]
gains = [208, 208, 208, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
