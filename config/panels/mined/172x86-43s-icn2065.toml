# 172x86 module, 1/43 scan, ICN2065: mined from 8 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (80% of the 10 files for this geometry and chip).
# Not bench-verified. Examples: Q1.8AR43(2065+2018)-W1.rcvbp, LCH1.86-172x688-43S-6168E-2018-3840Hz 领秀5G K5+.rcvbp, LCH1.8-344X344-43S-2065-2018-3900HZ-2.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 7396 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "172x86-43s-icn2065"

[module]
width = 172
height = 86
scan = 43
line_dir = 0
data_groups = 0
serial_clock = 10

[screen]
width = 172
height = 86

[chip]
library = "config/chips/mined/icn2065.toml"

[current]
gains = [208, 208, 208, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 172

[boot]
arm_at_boot = true
