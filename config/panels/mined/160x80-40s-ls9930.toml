# 160x80 module, 1/40 scan, LS9930: mined from 4 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (67% of the 6 files for this geometry and chip).
# Not bench-verified. Examples: P2-160x80-40S-9930+9736-S-one-way input.rcvbp, P2-160x80-40S-9930+9736-V6.2.rcvbp, P2-160x80-40S-9930+9736-V6.2.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "160x80-40s-ls9930"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 16

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/ls9930.toml"

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
