# 160x80 module, 1/40 scan, ICN2038S: mined from 8 vendor configs
# whose pixel maps fit the generator exactly with the wiring below
# (100% of the 8 files for this geometry and chip).
# Not bench-verified. Examples: P2.0-2038S-144-2019.5.22.rcvbp, P2-I(320x160)--2047+2018&5566&5368-V6.X&S.rcvbp, P2.0-6124-160640-1440-2020-11-14.rcvbp
# Generated by scripts/corpus-mine.py; regenerate rather than edit.
# NOTE: the pixel map has 6400 entries; the block-7 image builder packs
# at most 4096, so `e120 config gen` writes the .rcvbp but not the boot image.

name = "160x80-40s-icn2038s"

[module]
width = 160
height = 80
scan = 40
line_dir = 0
data_groups = 0
serial_clock = 6

[screen]
width = 160
height = 80

[chip]
library = "config/chips/mined/icn2038s.toml"

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[mapping]
reversed_groups = true
reversed_lines = false
block = 160

[boot]
arm_at_boot = true
