# One Eager LED P2.5-O16S-SMD1415-128x64-E module on hub J1 of the E120.
# Module spec: 128x64, 1/16 duty. Driver ICs read off the module: SM16269S.
#
# Generate with:  rxp config gen --spec config/panels/p25-128x64-sm16269s.toml --out-dir build
# Push to RAM:    rxp config send --spec config/panels/p25-128x64-sm16269s.toml
# Every byte of the output is a vendor default, a field below, a chip-library
# value, or a documented literal; see build/*-sources.txt.

name = "p25-128x64-sm16269s"

[meta]
pitch_mm = 2.5
status = "verified"
sources = 1
examples = ["P2.5-32S-128X64-SM16269S-256X384I.rcvbp"]
vendors = ["Colorlight"]
notes = "Driven from flash on a Colorlight E120 running firmware 16.53; record 0x01 differs from the reference file at 0x023, 0x02F and 0x0C0..0x0C3 (docs/rendering.md)."
maker = "Eager LED"
product = "P2.5-O16S-SMD1415-128x64-E"
url = "https://eager-led.com/products/outdoor-hd-p2-5-320x160mm-led-screen-module"
datasheet = "https://assets.receiverproxy.com/datasheets/panels/eager-p25-outdoor-smd1415-320x160.pdf"
image = "https://assets.receiverproxy.com/images/panels/eager-p25-o16s-smd1415-128x64.jpg"
image_source = "eager-led.com product photo"

[module]
# The card arrived saying 14. Kept at 12 because it is what was measured most;
# 12-16 render alike from flash (docs/rendering.md).
gray_bits = 12
width = 128
height = 64
scan = 16
line_dir = 0
data_groups = 1
# The reference config ran the serial clock at 8; the chip's vendor default is
# 15 (config/chips/sm16269-defaults.toml). Remove this line to use the default.
serial_clock = 8

[screen]
width = 128
height = 64

[chip]
library = "config/chips/sm16269s.toml"

[color]
swap = 3
source = [2, 1, 0]

[current]
gains = [43, 43, 43, 43]
percent = [0.1, 0.1, 0.1]

[timing]
gamma = 2.8
refresh_hz = 60.0
gclock = 0x14
min_oe = 0.0001
luminance_level = 188
oe_8ns = true

[mapping]
reversed_groups = true
reversed_lines = false
# Read straight out of the reference file for this panel: the two row-halves
# alternate along the shift chain every 64 columns, not once at the midpoint.
# Without this the columns land scrambled however correct the pixel data is.
block = 64

[boot]
# The card configures itself from flash at power-on; RAM pushes land on about
# one boot in three (docs/rendering.md).
arm_at_boot = true

[record01_overrides]
# The vendor's own Reset() default and 961 of 1146 corpus files; the
# configuration the card arrived with had cleared it, and with it cleared no
# pixel data is displayed. Meaning not resolved (docs/chip-control-block.md §5).
"0x02F" = 0x01
