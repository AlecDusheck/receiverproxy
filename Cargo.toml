[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/AlecDusheck/receiverproxy"
keywords = ["led", "display", "ethernet", "hardware", "colorlight"]
categories = ["hardware-support"]
# Kept out of every published .crate: the web app, the vendor archives, the
# research notes and the local flash dumps.
exclude = ["web/", "third-party/", "vendor/", "docs/", "build/", "card-dumps/", "analysis/", "*.pcap", "*.bin"]

# Fat LTO so the per-row frame builders inline into the driver's send loop.
# `panic` stays at unwind: Drop (the raw link fd) must still run on a panic.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
# Published under `receiverproxy-<role>`; the lib name each crate is used by
# stays the role (`use colorlight::…`), so the dependency key is the role.
colorlight = { package = "receiverproxy-colorlight", path = "crates/colorlight", version = "0.1.1" }
panelspec = { package = "receiverproxy-panelspec", path = "crates/panelspec", version = "0.1.1" }
receivers = { package = "receiverproxy-receivers", path = "crates/receivers", version = "0.1.1" }
rcvbp = { package = "receiverproxy-rcvbp", path = "crates/rcvbp", version = "0.1.1" }
rawlink = { package = "receiverproxy-rawlink", path = "crates/rawlink", version = "0.1.1" }
wall = { package = "receiverproxy-wall", path = "crates/wall", version = "0.1.1" }
sources = { package = "receiverproxy-sources", path = "crates/sources", version = "0.1.1" }
driver = { package = "receiverproxy-driver", path = "crates/driver", version = "0.1.1" }
ops = { package = "receiverproxy-ops", path = "crates/ops", version = "0.1.1" }
daemon = { package = "receiverproxy-daemon", path = "crates/daemon", version = "0.1.1" }
# Not published: the browser build of rcvbp and wall.
rcvbp-wasm = { path = "crates/rcvbp-wasm" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# TypeScript bindings for the web app, behind each crate's `ts` feature.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

# Tuning knobs (thresholds, disallowed methods, MSRV) live in clippy.toml.
[workspace.lints.clippy]
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
collapsible_if = "allow"
doc_lazy_continuation = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
single_match_else = "allow"
uninlined_format_args = "deny"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
future_not_send = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
struct_excessive_bools = "allow"
# Rotation matrices and grid arithmetic read far better written out than as mul_add.
suboptimal_flops = "allow"
multiple_crate_versions = "allow"
similar_names = "allow"

[workspace.lints.rust]
dead_code = "allow"
unsafe_code = "warn"
